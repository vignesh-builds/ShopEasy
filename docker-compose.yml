# Optional: starts PostgreSQL with the database/user/password the backend expects by default.
#   docker compose up -d
services:
  db:
    image: postgres:16
    container_name: shopeasy-db
    environment:
      POSTGRES_DB: shopeasy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - shopeasy-pgdata:/var/lib/postgresql/data

  # Optional local mail catcher:  docker compose --profile mail up -d
  # Web inbox: http://localhost:8025   SMTP: localhost:1025 (see README -> Email)
  mailhog:
    image: mailhog/mailhog
    container_name: shopeasy-mailhog
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  shopeasy-pgdata:
