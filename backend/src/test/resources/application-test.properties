# Used only by tests (profile "test"): in-memory H2, so no PostgreSQL server is needed for `mvn test`.
spring.datasource.url=jdbc:h2:mem:shopeasy_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=TestOnlySecretKeyTestOnlySecretKey1234567890
app.admin.email=admin@shop.com
app.admin.password=Admin@123

# mails: no spring.mail.host in tests (so mails are only logged), and sent on the calling thread
app.mail.async=false
app.frontend-url=http://localhost:5173
