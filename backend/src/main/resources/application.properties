spring.application.name=shopeasy
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopeasy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:ShopEasyDevelopmentSecretKeyChangeThisToAUniqueRandomSecret123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Account Configuration
app.admin.email=${ADMIN_EMAIL:admin@shop.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.reset-password-on-start=${ADMIN_RESET_PASSWORD:true}

# CORS Configuration
app.cors.allowed-origins=https://shopeasy-frontend-wvvl.onrender.com,http://localhost:5173

# Frontend Application URL (Email links create panna use aagum)
app.frontend.url=${FRONTEND_URL:https://shopeasy-frontend-wvvl.onrender.com}

# Brevo HTTP API Configuration (Email sending)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:sankardurga539@gmail.com}
brevo.sender.name=ShopEasy
