spring.application.name=shopeasy
server.port=${PORT:8080}

# PostgreSQL connection; override with environment variables in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopeasy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Replace this with a random secret of at least 32 bytes before deployment.
app.jwt.secret=${JWT_SECRET:ShopEasyDevelopmentSecretKeyChangeThisToAUniqueRandomSecret123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# First ADMIN account (created on startup if it does not exist)
app.admin.email=${ADMIN_EMAIL:admin@shop.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
# true: on every start the admin account is brought in line with the two values above
# (role ADMIN + this password), so an old/different password in the database cannot lock you out.
app.admin.reset-password-on-start=${ADMIN_RESET_PASSWORD:true}

# Browser origins allowed to call the API directly (the React dev server). Comma separated.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------------------------------------------------------------------------------------------
# Email (order confirmation / shipped / delivered, verify email, forgot password)
#
# Do NOT put an empty spring.mail.host in this file: Spring Boot treats "present" as "SMTP is configured".
# While SPRING_MAIL_HOST is not set, mails are PRINTED in the backend console (with their links) instead of sent,
# so everything works locally with zero setup. To really send, set these environment variables:
#
#   SendGrid  : SPRING_MAIL_HOST=smtp.sendgrid.net   SPRING_MAIL_PORT=587
#               SPRING_MAIL_USERNAME=apikey          SPRING_MAIL_PASSWORD=<your SendGrid API key>
#   Amazon SES: SPRING_MAIL_HOST=email-smtp.ap-south-1.amazonaws.com   SPRING_MAIL_PORT=587
#               SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD = your SES SMTP credentials
#   Gmail     : SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587
#               SPRING_MAIL_USERNAME=you@gmail.com  SPRING_MAIL_PASSWORD=<16-character app password>
#
# MAIL_FROM must be a sender address you verified with the provider. FRONTEND_URL is the public address
# of the React app (used for the links inside the mails).
# ---------------------------------------------------------------------------------------------
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:ShopEasy <no-reply@shopeasy.local>}
app.mail.async=true
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
