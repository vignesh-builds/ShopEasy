spring.application.name=shopeasy
server.port=${PORT:8080}

# PostgreSQL connection; override with environment variables in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopeasy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Replace this with a random secret of at least 32 bytes before deployment.
app.jwt.secret=${JWT_SECRET:ShopEasyDevelopmentSecretKeyChangeThisToAUniqueRandomSecret123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# First ADMIN account (created on startup if it does not exist)
app.admin.email=${ADMIN_EMAIL:admin@shop.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
# true: on every start the admin account is brought in line with the two values above
# (role ADMIN + this password), so an old/different password in the database cannot lock you out.
app.admin.reset-password-on-start=${ADMIN_RESET_PASSWORD:true}

# Browser origins allowed to call the API directly (the React dev server). Comma separated.
app.cors.allowed-origins=https://shopeasy-frontend-wvvl.onrender.com,http://localhost:5173

# Server Port (Render PORT env variable-ah automatic-ah eduthukkum)
server.port=${PORT:8080}

# Brevo API Settings
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:ShopEasy}

